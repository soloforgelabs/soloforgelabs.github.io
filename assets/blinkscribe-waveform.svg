    <rect class="mirror-bar" x="314" y="15" width="6" height="60" rx="3" style="animation-duration: 0.84s; animation-delay: 0.27s;" />
    <rect class="mirror-bar" x="329" y="15" width="6" height="60" rx="3" style="animation-duration: 0.76s; animation-delay: 0.32s;" />
    <rect class="mirror-bar" x="344" y="15" width="6" height="60" rx="3" style="animation-duration: 0.88s; animation-delay: 0.15s;" />
    <rect class="mirror-bar" x="359" y="15" width="6" height="60" rx="3" style="animation-duration: 0.82s; animation-delay: 0.25s;" />
  </g>
