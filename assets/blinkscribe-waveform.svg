<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .mirror-bar {
        transform-origin: 50% 45px;
        animation: blinkMirrorPulse 0.85s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
      }
      @keyframes blinkMirrorPulse {
        0%, 100% {
          transform: scaleY(0.2);
          opacity: 0.65;
        }
        25% {
          transform: scaleY(0.92);
          opacity: 1;
        }
        50% {
          transform: scaleY(0.38);
          opacity: 0.75;
        }
        75% {
          transform: scaleY(0.98);
          opacity: 1;
        }
      }
    </style>
  </defs>

  <g filter="url(#cyanGlow)" fill="#00E5FF">
    <!-- 24 Symmetrical Mirror Equalizer Bars for BlinkScribe -->
    <rect class="mirror-bar" x="14"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.78s; animation-delay: 0.00s;" />
    <rect class="mirror-bar" x="29"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.86s; animation-delay: 0.04s;" />
    <rect class="mirror-bar" x="44"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.94s; animation-delay: 0.08s;" />
    <rect class="mirror-bar" x="59"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.82s; animation-delay: 0.12s;" />
    <rect class="mirror-bar" x="74"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.90s; animation-delay: 0.16s;" />
    <rect class="mirror-bar" x="89"  y="15" width="6" height="60" rx="3" style="animation-duration: 0.75s; animation-delay: 0.20s;" />
    <rect class="mirror-bar" x="104" y="15" width="6" height="60" rx="3" style="animation-duration: 0.88s; animation-delay: 0.24s;" />
    <rect class="mirror-bar" x="119" y="15" width="6" height="60" rx="3" style="animation-duration: 0.96s; animation-delay: 0.28s;" />
    <rect class="mirror-bar" x="134" y="15" width="6" height="60" rx="3" style="animation-duration: 0.80s; animation-delay: 0.32s;" />
    <rect class="mirror-bar" x="149" y="15" width="6" height="60" rx="3" style="animation-duration: 0.85s; animation-delay: 0.05s;" />
    <rect class="mirror-bar" x="164" y="15" width="6" height="60" rx="3" style="animation-duration: 0.92s; animation-delay: 0.10s;" />
    <rect class="mirror-bar" x="179" y="15" width="6" height="60" rx="3" style="animation-duration: 0.79s; animation-delay: 0.15s;" />
    <rect class="mirror-bar" x="194" y="15" width="6" height="60" rx="3" style="animation-duration: 0.87s; animation-delay: 0.20s;" />
    <rect class="mirror-bar" x="209" y="15" width="6" height="60" rx="3" style="animation-duration: 0.95s; animation-delay: 0.25s;" />
    <rect class="mirror-bar" x="224" y="15" width="6" height="60" rx="3" style="animation-duration: 0.83s; animation-delay: 0.30s;" />
    <rect class="mirror-bar" x="239" y="15" width="6" height="60" rx="3" style="animation-duration: 0.91s; animation-delay: 0.02s;" />
