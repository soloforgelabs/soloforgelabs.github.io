<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sfl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sfl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Prism -->
  <rect width="100" height="100" rx="20" fill="#0c0e14" />
  <rect width="98" height="98" x="1" y="1" rx="19" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Cyber Forge Monogram (S-F-L Inverted Wing Delta) -->
  <g filter="url(#sfl-glow)" transform="translate(14, 14) scale(0.72)">
    <!-- Top S-Wing -->
    <path d="M 12 18 L 88 18 L 68 34 L 28 34 Z" fill="url(#sfl-grad)" />
    <!-- Mid F-Bar & Anvil Delta -->
    <path d="M 28 42 L 76 42 L 62 56 L 24 56 Z" fill="url(#sfl-grad)" opacity="0.9" />
    <!-- Bottom L-Spur -->
    <path d="M 24 64 L 54 64 L 40 78 L 12 78 Z" fill="url(#sfl-grad)" opacity="0.8" />
    <!-- Vertical Connectors -->
    <path d="M 12 18 L 28 34 L 28 42 L 12 28 Z" fill="#00f0ff" opacity="0.7" />
    <path d="M 68 34 L 88 18 L 76 42 L 62 42 Z" fill="#10b981" opacity="0.6" />
  </g>
</svg>
