    <rect class="mirror-bar" x="299" y="15" width="6" height="60" rx="3" style="animation-delay: 0.49s;" />
    <rect class="mirror-bar" x="314" y="15" width="6" height="60" rx="3" style="animation-delay: 0.56s;" />
