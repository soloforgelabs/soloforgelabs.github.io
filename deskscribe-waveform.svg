    <rect class="mirror-bar" x="239" y="15" width="6" height="60" rx="3" style="animation-delay: 0.21s;" />
    <rect class="mirror-bar" x="254" y="15" width="6" height="60" rx="3" style="animation-delay: 0.28s;" />
    <rect class="mirror-bar" x="269" y="15" width="6" height="60" rx="3" style="animation-delay: 0.35s;" />
